<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>앗싸라비아 · 경산 Beer & Soju 메타버스</title>
<meta name="description" content="경산 옥산동 맥주집 앗싸라비아를 3D로 구경하고, 맥주 마스터가 따르는 생맥으로 같이 짠!">
<meta property="og:title" content="🍺 앗싸라비아 · 경산 Beer & Soju 메타버스">
<meta property="og:description" content="링크 하나로 들어가는 3D 맥주집. 생맥 받고, 안주 시키고, 다른 손님이랑 짠!">
<meta name="theme-color" content="#141a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b3029;--cream:#fffaf3;--accent:#a95e42;--gold:#e8b65a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1b2240;
  font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none;}
#app{position:fixed;inset:0;}
canvas{display:block;}
.jua{font-family:'Jua','Noto Sans KR',sans-serif;}
.glass{background:rgba(255,250,243,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(20,14,30,.22);border:1px solid rgba(255,255,255,.6);}

/* 상단 */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;
  align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 12px 0;pointer-events:none;opacity:0;transition:opacity .8s;}
#hud.on{opacity:1;}
#hud>*{pointer-events:auto;}
#sign{border-radius:18px;padding:8px 14px 9px;color:var(--ink);}
#sign b{font-family:'Jua',sans-serif;font-weight:400;font-size:18px;display:block;line-height:1.15;}
#sign small{font-size:11px;opacity:.7;font-weight:700;}
#stamps{display:flex;gap:5px;margin-top:6px;align-items:center;font-size:11px;font-weight:800;color:var(--ink);}
#stamps i{width:15px;height:15px;border-radius:50%;border:2px dashed rgba(59,48,41,.35);display:inline-block;transition:all .4s;}
#stamps i.on{border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 0 10px currentColor;transform:scale(1.15);}
#right{display:flex;flex-direction:column;gap:7px;align-items:flex-end;}
#times{display:flex;border-radius:16px;padding:3px;gap:2px;}
#times button,#snd{border:none;background:transparent;font-size:17px;width:36px;height:32px;border-radius:12px;cursor:pointer;transition:all .2s;}
#times button.on{background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25);}
#snd{border-radius:14px;width:42px;height:38px;}
#online{border-radius:14px;padding:6px 11px;font-size:12px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:6px;}
#online .dot{width:8px;height:8px;border-radius:50%;background:#aaa;}
#online.live .dot{background:#2ecc71;box-shadow:0 0 8px #2ecc71;animation:blink 1.6s infinite;}
@keyframes blink{50%{opacity:.4}}
#talk{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px) scale(.96);z-index:25;
  border-radius:20px;padding:10px;width:min(340px,92vw);display:grid;grid-template-columns:1fr 1fr;gap:6px;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.9,.3,1.3);}
#talk.open{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
#talk button{border:none;border-radius:12px;padding:9px 6px;background:#fff;color:var(--ink);font-family:'Jua',sans-serif;font-size:14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);}
#talk button.emo{background:linear-gradient(160deg,#fff4dc,#ffd9a8);}
#talk button:active{transform:scale(.94);}

/* 토스트 */
#hint{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);
  color:var(--ink);padding:10px 18px;border-radius:16px;font-size:13.5px;font-weight:700;z-index:20;
  opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;max-width:90%;text-align:center;line-height:1.45;}
#hint.show{opacity:1;transform:translate(-50%,0);}

/* 하단 바 */
#bar{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:6px;
  padding:14px 8px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(20,16,36,.55),transparent);opacity:0;transform:translateY(30px);transition:all .7s .2s;}
#bar.on{opacity:1;transform:none;}
.btn{border:none;border-radius:16px;padding:8px 2px 7px;min-width:54px;flex:0 1 64px;color:var(--ink);
  font-family:'Jua',sans-serif;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:transform .1s;}
.btn:active{transform:scale(.9);}
.btn .ic{font-size:21px;line-height:1.1;}
.btn.hot{background:linear-gradient(160deg,#fff4dc,#ffd9a8);}

/* 입장 */
#enter{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 120%,rgba(255,190,60,.5),rgba(20,18,50,.6) 70%);transition:opacity .7s;}
#enter.hide{opacity:0;pointer-events:none;}
#ecard{width:100%;max-width:360px;border-radius:26px;padding:24px 22px 20px;text-align:center;color:var(--ink);
  background:rgba(255,250,243,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(10,8,30,.45);
  animation:pop .7s cubic-bezier(.2,.9,.3,1.2);}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
#ecard .orb{width:62px;height:62px;margin:0 auto 8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#c9b6ff 30%,#6b4fb8 70%,#2c1f5c);box-shadow:0 0 30px #a98bff,0 0 60px rgba(169,139,255,.5);
  animation:glow 2.4s ease-in-out infinite;}
@keyframes glow{50%{box-shadow:0 0 40px #ffcf8a,0 0 80px rgba(255,180,120,.6);transform:scale(1.05)}}
#ecard h1{font-family:'Jua',sans-serif;font-weight:400;font-size:27px;}
#ecard p.sub{font-size:13px;opacity:.7;margin:4px 0 16px;font-weight:700;}
#ecard label{display:block;text-align:left;font-size:12px;font-weight:800;opacity:.7;margin:10px 2px 6px;}
#nick{width:100%;border:2px solid #eadfcf;border-radius:14px;padding:11px 14px;font-size:16px;font-family:inherit;font-weight:700;
  background:#fff;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;}
#nick:focus{border-color:#e8a46a;}
#sw{display:flex;gap:9px;justify-content:center;}
#sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .15s;}
#sw button.on{transform:scale(1.18);box-shadow:0 0 0 3px var(--ink);}
#go{margin-top:18px;width:100%;border:none;border-radius:16px;padding:14px;font-family:'Jua',sans-serif;font-size:19px;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,#ffcf3a,#f08a1c 50%,#7a3fd0);box-shadow:0 10px 24px rgba(240,138,28,.45);}
#go:active{transform:scale(.97);}
#ecard .tip{font-size:11px;opacity:.55;margin-top:10px;font-weight:700;}

/* 사주 오버레이 */
#overlay{position:absolute;inset:0;z-index:50;display:none;background:rgba(18,14,30,.6);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);flex-direction:column;align-items:center;justify-content:center;padding:12px;}
#overlay.open{display:flex;animation:fade .3s;}
@keyframes fade{from{opacity:0}}
#card{width:100%;max-width:440px;height:92%;max-height:860px;background:var(--cream);border-radius:22px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.2,.9,.3,1.2);}
#cardhead{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff6e9;}
#cardhead .who{font-family:'Jua',sans-serif;font-size:18px;}
#cardhead .tone{font-size:11px;opacity:.9;font-weight:700;}
#cardhead .sp{flex:1;}
#cardhead button{background:rgba(255,255,255,.2);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;}
#frameWrap{flex:1;position:relative;background:#fff;}
#frameWrap iframe{width:100%;height:100%;border:none;}
#frameLoad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  color:var(--ink);font-family:'Jua',sans-serif;font-size:16px;background:var(--cream);}
.spin{width:38px;height:38px;border:4px solid #e7ddcf;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#react{display:flex;gap:8px;padding:10px 14px;background:var(--cream);border-top:1px solid #ece2d4;}
#react button{flex:1;border:none;border-radius:13px;padding:10px;font-family:'Jua',sans-serif;font-size:14px;cursor:pointer;background:#f0e7d9;color:var(--ink);}
#react button:active{transform:scale(.95);}

#flash{position:absolute;inset:0;background:#fff;z-index:70;opacity:0;pointer-events:none;transition:opacity .5s;}
#flash.on{opacity:1;transition:none;}

#boot{position:absolute;inset:0;z-index:99;background:linear-gradient(#141a33,#3a2a5a 60%,#e8a91e);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;transition:opacity .6s;}
#boot h1{font-family:'Jua',sans-serif;font-weight:400;font-size:26px;}
#boot p{font-size:13px;opacity:.85;font-weight:700;}
#boot .spin{border-color:rgba(255,255,255,.3);border-top-color:#fff;}

#ecard .orb{background:none;box-shadow:none;font-size:52px;line-height:62px;animation:bob 1.6s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
#beerTag{margin-top:6px;font-size:12px;font-weight:900;color:var(--ink);}
#bMap{border:none;border-radius:14px;padding:8px 12px;font-family:'Jua',sans-serif;font-size:14px;cursor:pointer;color:var(--ink);}
#menuPanel{position:absolute;inset:0;z-index:45;display:none;align-items:flex-end;justify-content:center;background:rgba(15,12,30,.45);padding:12px;}
#menuPanel.open{display:flex;animation:fade .25s;}
#mCard{width:100%;max-width:440px;max-height:78%;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:#fff8e6;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:pop .4s cubic-bezier(.2,.9,.3,1.2);}
#mHead{display:flex;align-items:center;padding:13px 16px;background:linear-gradient(135deg,#ffcf3a,#f08a1c);color:#3b1d5a;}
#mHead b{font-family:'Jua',sans-serif;font-size:19px;font-weight:400;flex:1;}
#mHead button{border:none;background:rgba(255,255,255,.45);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;}
#mList{overflow:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
#mList button{border:none;border-radius:14px;background:#fff;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);color:var(--ink);}
#mList button:active{transform:scale(.95);}
#mList .e{font-size:24px;}#mList .n{font-family:'Jua',sans-serif;font-size:14px;}#mList .p{font-size:12px;font-weight:800;color:#c0661a;}
#mNote{font-size:11px;opacity:.6;padding:0 14px 12px;font-weight:700;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="sign" class="glass">
    <b>🍺 앗싸라비아</b><small>경산 Beer &amp; Soju · <span id="who">손님</span>님 입장 중</small>
    <div id="beerTag">오늘 마신 생맥 <span id="beerN">0</span>잔 🍺</div>
  </div>
  <div id="right">
    <button id="bMap" class="glass">📍 오시는 길</button>
    <button id="snd" class="glass" title="소리">🔊</button>
    <div id="online" class="glass"><span class="dot"></span><span id="onN">연결 중…</span></div>
  </div>
</div>
<div id="hint" class="glass"></div>
<div id="bar">
  <button class="btn glass hot" id="bBeer"><span class="ic">🍺</span>생맥주</button>
  <button class="btn glass" id="bFood"><span class="ic">🍢</span>안주</button>
  <button class="btn glass" id="bCheers"><span class="ic">🍻</span>짠</button>
  <button class="btn glass" id="bTalk"><span class="ic">💬</span>말하기</button>
  <button class="btn glass" id="bSnap"><span class="ic">📸</span>사진</button>
</div>
<div id="talk" class="glass"></div>
<div id="menuPanel"><div id="mCard">
  <div id="mHead"><b>🍢 안주 메뉴판</b><button id="mClose">×</button></div>
  <div id="mList"></div>
  <div id="mNote">네이버 플레이스 메뉴 일부 · 실제 가격·메뉴는 매장 기준</div>
</div></div>
<div id="enter">
  <div id="ecard">
    <div class="orb">🍺</div>
    <h1>앗싸라비아</h1>
    <p class="sub">경산 Beer &amp; Soju · 맥주 마스터가 따르는 생맥</p>
    <label>내 이름</label>
    <input id="nick" maxlength="8" placeholder="손님" autocomplete="off">
    <label>오늘의 옷 색</label>
    <div id="sw"></div>
    <button id="go">🍻 가게 들어가기</button>
    <div class="tip">🔊 음악이 나와요 · 화면 끌면 360° · 위에서 보면 가게 안이 보여요</div>
  </div>
</div>
<div id="flash"></div>
<div id="boot"><div class="spin"></div><h1>🍺 앗싸라비아</h1><p>경산 밤거리에 불 켜는 중…</p></div>

let sky;
function buildSky(){
 skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vP;void main(){vec3 d=normalize(vP);float h=d.y;
   vec3 col=mix(vec3(.16,.13,.28),vec3(.03,.05,.13),smoothstep(-0.02,0.55,h));
   vec3 m=normalize(vec3(-0.45,0.42,-0.78));float s=max(dot(d,m),0.);
   col+=vec3(.55,.6,.9)*pow(s,40.)*.25;col=mix(col,vec3(.95,.93,.85),smoothstep(0.9993,0.9996,s));
   col+=vec3(.35,.2,.1)*smoothstep(.12,0.,h)*.35;
   gl_FragColor=vec4(col,1.);}`});
 sky=new THREE.Mesh(new THREE.SphereGeometry(150,32,16),skyMat);scene.add(sky);
 const N=700,pos=new Float32Array(N*3);
 for(let i=0;i<N;i++){const th=Math.random()*Math.PI*2,ph=Math.acos(rnd(0.12,1));pos[i*3]=Math.sin(ph)*Math.cos(th)*140;pos[i*3+1]=Math.cos(ph)*140;pos[i*3+2]=Math.sin(ph)*Math.sin(th)*140;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));

}

function mkAgent(f,x,z,speed){f.position.set(x,0,z);scene.add(f);const a={f,speed,target:null,path:[],cb:null,stuck:0,holding:false,seat:null};agents.push(a);return a;}
function sitAt(a,s){a.seat=s;s.occ=a;a.f.position.set(s.x,s.y,s.z);a.f.rotation.y=s.yaw;a.f.userData.mode='sit';a.target=null;a.path=[];}
function standUp(a){if(a.f.userData.mode!=='sit')return;const s=a.seat;a.f.userData.mode='stand';a.f.position.y=0;
 if(s){a.f.position.x=s.ax;a.f.position.z=s.az;s.occ=null;a.seat=null;}if(a.tableMug)a.tableMug.visible=false;}
const inside=z=>z<FRONT;
const inDoor=x=>x>DOOR[0]&&x<DOOR[1];
function walkAgent(a,x,z,cb){standUp(a);const p=a.f.position;a.path=[];
 if(inside(p.z)!==inside(z)){const dx=(DOOR[0]+DOOR[1])/2;a.path.push(new THREE.Vector3(dx,0,inside(p.z)?3.7:5.3));a.path.push(new THREE.Vector3(dx,0,inside(p.z)?5.3:3.7));}
 a.path.push(new THREE.Vector3(x,0,z));a.target=a.path.shift();a.cb=cb||null;a.stuck=0;}
function clampPos(p,oz){
 if(inDoor(p.x)&&p.z>3.5&&p.z<5.4)return;
 if(inside(oz)){p.x=clamp(p.x,-5.1,5.1);p.z=clamp(p.z,-3.25,3.75);}
 else{p.x=clamp(p.x,-16,16);p.z=clamp(p.z,4.95,11.8);}}
function pushOut(p,r,self){
 for(const o of OBST){const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz),m=o.r+r;if(d<m&&d>1e-4){p.x=o.x+dx/d*m;p.z=o.z+dz/d*m;}}
 for(const a of agents){if(a.f===self||a.f.userData.mode==='sit'||!a.f.visible)continue;const q=a.f.position,dx=p.x-q.x,dz=p.z-q.z,d=Math.hypot(dx,dz),m=0.5;if(d<m&&d>1e-4){p.x+=dx/d*(m-d)*0.5;p.z+=dz/d*(m-d)*0.5;}}}
function moveAgent(a,dt){
 const u=a.f.userData;if(u.mode==='sit')return;
 if(!a.target){u.mode='stand';return;}
 const p=a.f.position,dx=a.target.x-p.x,dz=a.target.z-p.z,dist=Math.hypot(dx,dz);
 if(dist>0.07){const st=Math.min(a.speed*dt,dist),ox=p.x,oz=p.z;p.x+=dx/dist*st;p.z+=dz/dist*st;
  if(!(inDoor(p.x)&&p.z>3.4&&p.z<5.5))pushOut(p,0.28,a.f);
  if(inside(oz)!==inside(p.z)&&!inDoor(p.x))p.z=oz;
  clampPos(p,oz);
  a.f.rotation.y+=angDiff(a.f.rotation.y,Math.atan2(dx,dz))*Math.min(1,dt*10);u.mode='walk';
  const mv=Math.hypot(p.x-ox,p.z-oz);a.stuck=mv<st*0.25?a.stuck+dt:0;if(a.stuck>0.9)arrive(a);}
 else arrive(a);}
function arrive(a){if(a.path.length){a.target=a.path.shift();a.stuck=0;return;}
 a.target=null;a.f.userData.mode='stand';const cb=a.cb;a.cb=null;if(a===player)moveMarker.material.opacity=0;cb&&cb();}

const liteGeo={};const liteMat={};
function liteFigure(c){
 if(!liteGeo.b){liteGeo.b=new THREE.CylinderGeometry(0.17,0.32,0.95,10);liteGeo.b.translate(0,0.48,0);liteGeo.h=new THREE.SphereGeometry(0.27,12,10);liteGeo.h.translate(0,1.22,0);liteGeo.hr=new THREE.SphereGeometry(0.285,12,8,0,Math.PI*2,0,Math.PI*0.55);liteGeo.hr.rotateX(-0.38);liteGeo.hr.translate(0,1.235,0);liteMat.skin=M(0xf2c9a0,0.6);liteMat.hair=M(0x2a2018,0.85);}
 if(!liteMat[c])liteMat[c]=M(c,0.8);
 const g=new THREE.Group();g.add(new THREE.Mesh(liteGeo.b,liteMat[c]),new THREE.Mesh(liteGeo.h,liteMat.skin),new THREE.Mesh(liteGeo.hr,liteMat.hair));scene.add(g);return g;}
function addPeer(o){
 const c=OUTFITS.includes(o.c)?o.c:OUTFITS[0];
 const pe={id:o.i,n:cleanName(o.n),c,pos:new THREE.Vector3(+o.x||0,0,+o.z||0),tx:0,tz:0,ty:0,tr:0,rot:+o.r||0,m:0,h:false,seen:performance.now(),full:null,lite:liteFigure(c),react:null,reactT:0};
 NET.peers.set(o.i,pe);setOnline();return pe;}
function makePeerFull(pe){
 const f=makeFigure({robe:pe.c,top:0xf6efe4,hair:0x2a2018,skin:0xf2c9a0,style:'p',ribbon:0x3b3029});
 f.traverse(m=>{if(m.isMesh)m.castShadow=false;});
 addTag(f,pe.n,0,1.98,false);addBubble(f,2.5);
 const tr=new THREE.Group();tr.position.set(0,0.98,0.34);tr.visible=false;f.userData.rig.add(tr);
 tr.add(makeMug());
 pe.tray=tr;scene.add(f);pe.full=f;}
function disposeObj(o){scene.remove(o);o.traverse(m=>{if(m.isMesh||m.isSprite){if(m.geometry&&m.geometry!==liteGeo.b&&m.geometry!==liteGeo.h&&m.geometry!==liteGeo.hr)m.geometry.dispose();
 if(m.material&&!Object.values(liteMat).includes(m.material)){if(m.material.map&&m.material.map!==glowTex)m.material.map.dispose();m.material.dispose();}}});}
function removePeer(id){const pe=NET.peers.get(id);if(!pe)return;if(pe.full)disposeObj(pe.full);scene.remove(pe.lite);NET.peers.delete(id);setOnline();}
function updateLOD(){
 const arr=[...NET.peers.values()];const cp=camera.position;
 arr.forEach(pe=>pe.dd=pe.pos.distanceToSquared(cp));arr.sort((a,b)=>a.dd-b.dd);
 arr.forEach((pe,i)=>{const near=i<FULL_MAX;
  if(near&&!pe.full)makePeerFull(pe);
  if(pe.full)pe.full.visible=near;pe.lite.visible=!near;
  if(!near&&pe.full&&i>FULL_MAX+15){disposeObj(pe.full);pe.full=null;}});
}
function peerFulls(){const r=[];NET.peers.forEach(pe=>{if(pe.full&&pe.full.visible)r.push({f:pe.full});});return r;}
function onNet(buf){
 if(!buf||buf.length>400)return;let o;try{o=JSON.parse(buf.toString());}catch(e){return;}
 if(!o||typeof o.i!=='string'||o.i.length>16||o.i===NET.id)return;
 if(o.t==='bye'){removePeer(o.i);return;}
 let pe=NET.peers.get(o.i);
 if(o.t==='s'){
  if(!pe){if(NET.peers.size>=150)return;pe=addPeer(o);pe.pos.set(clamp(+o.x||0,-8,8),0,clamp(+o.z||0,-8,8));}
  pe.seen=performance.now();pe.tx=clamp(+o.x||0,-8,8);pe.tz=clamp(+o.z||0,-8,8);pe.ty=clamp(+o.y||0,0,1);pe.tr=+o.r||0;pe.m=o.m|0;pe.h=!!o.h;
  const nm=cleanName(o.n);const col=OUTFITS.includes(o.c)?o.c:pe.c;
  if(nm!==pe.n||col!==pe.c){pe.n=nm;pe.c=col;if(pe.full){disposeObj(pe.full);pe.full=null;}scene.remove(pe.lite);pe.lite=liteFigure(col);NET.lod=0;}
 }else if(o.t==='e'&&pe){pe.seen=performance.now();
  if(o.k==='say'){const ph=PHRASES[o.v|0];if(ph&&pe.full&&pe.full.visible)say(pe.full,ph,3);}
  else if(o.k==='cheers'){if(pe.full&&pe.full.visible){say(pe.full,'짠~! 🍻',2);const hp=pe.full.position.clone().add(new THREE.Vector3(0,2,0));spawn('🍻',hp,2,{size:0.3,up:1.2,life:1.2});}
   if(pe.pos.distanceTo(player.f.position)<5){sfx('clink');toast('🍻 '+pe.n+'님이 짠! 했어요');}}
  else if(o.k==='happy'||o.k==='cry'){pe.react=o.k;pe.reactT=0;
   if(pe.full&&pe.full.visible)say(pe.full,o.k==='happy'?'😆':'😭',1.5);}}
}


/* ---------------- 로더 ---------------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
(async function(){
 const cdns=["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js","https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"];
 if(window.LOCAL_THREE)cdns.unshift(window.LOCAL_THREE);
 let ok=false;for(const u of cdns){try{await loadScript(u);if(window.THREE){ok=true;break;}}catch(e){}}
 const boot=document.getElementById('boot');
 if(!ok){boot.innerHTML='<h1>🔮 양자팔자 사주카페</h1><p>3D 엔진 로딩 실패 — 새로고침하거나 크롬에서 열어주세요</p>';return;}
 try{await Promise.race([document.fonts?document.fonts.load('40px "Jua"'):0,new Promise(r=>setTimeout(r,1500))]);}catch(e){}
 try{init();}catch(err){console.error(err);boot.innerHTML='<h1>⚠️ 오류</h1><p style="max-width:80%;text-align:center;line-height:1.5">'+(err&&err.message||err)+'</p>';return;}
 setTimeout(()=>{boot.style.opacity=0;setTimeout(()=>boot.remove(),600);},400);
})();

</script>
