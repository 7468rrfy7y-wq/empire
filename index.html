canvas{display:block;}

/* 상단 */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;
  align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 12px 0;pointer-events:none;opacity:0;transition:opacity .8s;}

#right{display:flex;flex-direction:column;gap:7px;align-items:flex-end;}
#times{display:flex;border-radius:16px;padding:3px;gap:2px;}

#snd{border-radius:14px;width:42px;height:38px;}

#talk{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px) scale(.96);z-index:25;

#talk button.emo{background:linear-gradient(160deg,#fff4dc,#ffd9a8);}

/* 토스트 */
#hint{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);
  color:var(--ink);padding:10px 18px;border-radius:16px;font-size:13.5px;font-weight:700;z-index:20;
  opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;max-width:90%;text-align:center;line-height:1.45;}

/* 하단 바 */

/* 입장 */

/* 사주 오버레이 */
#overlay{position:absolute;inset:0;z-index:50;display:none;background:rgba(18,14,30,.6);backdrop-filter:blur(6px);

.spin{width:38px;height:38px;border:4px solid #e7ddcf;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;}

#flash{position:absolute;inset:0;background:#fff;z-index:70;opacity:0;pointer-events:none;transition:opacity .5s;}

#beerTag{margin-top:6px;font-size:12px;font-weight:900;color:var(--ink);}
#bMap{border:none;border-radius:14px;padding:8px 12px;font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;cursor:pointer;color:var(--ink);}

#mCard{width:100%;max-width:440px;max-height:78%;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:#fff8e6;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:pop .4s cubic-bezier(.2,.9,.3,1.2);}
#mHead{display:flex;align-items:center;padding:13px 16px;background:linear-gradient(135deg,#ffcf3a,#f08a1c);color:#3b1d5a;}

#mHead button{border:none;background:rgba(255,255,255,.45);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;}
#mList{overflow:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
#mList button{border:none;border-radius:14px;background:#fff;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);color:var(--ink);}

#mList .e{font-size:24px;}#mList .n{font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;}#mList .p{font-size:12px;font-weight:800;color:#c0661a;}
#mNote{font-size:11px;opacity:.6;padding:0 14px 12px;font-weight:700;text-align:center;}

];

 const key=new THREE.DirectionalLight(0xfff0d8,0.6);key.position.set(6,24,10);key.castShadow=true;
 key.shadow.mapSize.set(2048,2048);const sc=key.shadow.camera;sc.left=-26;sc.right=26;sc.top=26;sc.bottom=-26;sc.near=1;sc.far=60;key.shadow.bias=-0.0005;key.shadow.normalBias=0.02;
 scene.add(key);

   if(pinchD)camDist=clamp(camDist-(d-pinchD)*0.04,8,40);pinchD=d;dragging=false;dragMoved=true;camGoal=null;}},{passive:true});

 [[0,30,0,30,0.9],[20,12,0,6,0.7],[-20,12,0,6,0.7],[0,12,20,6,0.6],[0,12,-20,6,0.6]].forEach(([x,y,z,s,i])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(s*2,s),new THREE.MeshBasicMaterial({color:new THREE.Color(1,0.92,0.78).multiplyScalar(i),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m);});

function occ(g,r){const o={g,r,a:1,mats:[]};g.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(g);o.c=b.getCenter(new THREE.Vector3());
 g.traverse(m=>{if(m.isMesh||m.isSprite){m.material=m.material.clone();m.material.userData.o0=m.material.opacity;m.material.transparent=true;o.mats.push(m.material);}});occluders.push(o);return o;}

/* ---------------- 밤하늘 · 도시 ---------------- */
function buildSky(){
 sky=new THREE.Mesh(new THREE.SphereGeometry(180,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vP;void main(){float h=normalize(vP).y;vec3 c=mix(vec3(.10,.07,.10),vec3(.01,.015,.04),smoothstep(-0.02,0.5,h));c+=vec3(.35,.22,.12)*smoothstep(.15,0.,h)*.4;gl_FragColor=vec4(c,1.);}`}));
 scene.add(sky);
 const N=700,pos=new Float32Array(N*3);for(let i=0;i<N;i++){const th=Math.random()*6.283,ph=Math.acos(rnd(0.15,1));pos[i*3]=Math.sin(ph)*Math.cos(th)*170;pos[i*3+1]=Math.cos(ph)*170;pos[i*3+2]=Math.sin(ph)*Math.sin(th)*170;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 stars=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false,transparent:true,opacity:0.7,fog:false,depthWrite:false}));scene.add(stars);
 // 멀리 도시 야경 (명품관 꼭대기 층 뷰)
 const winT=ctex(64,128,(x,w,h)=>{x.fillStyle='#0c0d14';x.fillRect(0,0,w,h);for(let r=0;r<16;r++)for(let c=0;c<4;c++)if(Math.random()<0.45){x.fillStyle=pick(['#ffd9a0','#fff0d0','#a8c8ff','#ffe9b8']);x.fillRect(4+c*15,4+r*8,9,5);}});
 for(let i=0;i<70;i++){const a=i/70*Math.PI*2+rnd(-0.03,0.03),r=rnd(55,90),h=rnd(8,40),w=rnd(4,9);
  const t=winT.clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,h/12);
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshBasicMaterial({map:t,color:0xbbbbbb}));b.position.set(Math.sin(a)*r,h/2-6,Math.cos(a)*r);b.lookAt(0,h/2-6,0);scene.add(b);}

function buildAtrium(){

   for(let k=0;k<6;k++){px+=rnd(-160,160);py+=rnd(-160,160);x.quadraticCurveTo(px+rnd(-60,60),py+rnd(-60,60),px,py);}x.stroke();}},[5,5]);
 const floor=new THREE.Mesh(new THREE.CircleGeometry(R_FLOOR,96),new THREE.MeshStandardMaterial({map:marbleT,roughness:0.22,metalness:0.05}));
 floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);floorHits.push(floor);
 // 바닥 금 링 + 중앙 상감 문양
 [3.2,3.3,11.6,11.68,R_FLOOR-0.4].forEach(r=>{const ring=new THREE.Mesh(new THREE.RingGeometry(r,r+0.06,128),new THREE.MeshStandardMaterial({color:0xd8b36a,metalness:1,roughness:0.25}));ring.rotation.x=-Math.PI/2;ring.position.y=0.006;scene.add(ring);});
 const inlayT=ctex(1024,1024,(x,w,h)=>{const c=w/2;x.clearRect(0,0,w,h);
  x.strokeStyle='#d8b36a';x.lineWidth=4;for(let i=0;i<16;i++){const a=i/16*Math.PI*2;x.beginPath();x.moveTo(c+Math.cos(a)*150,c+Math.sin(a)*150);x.lineTo(c+Math.cos(a+0.2)*470,c+Math.sin(a+0.2)*470);x.lineTo(c+Math.cos(a)*500,c+Math.sin(a)*500);x.stroke();}
  x.fillStyle='#d8b36a';x.textAlign='center';x.textBaseline='middle';x.font='120px "Noto Serif KR",serif';x.fillText('EMPIRE',c,c-20);
  x.font='38px serif';x.fillText('ONLINE  DEPARTMENT  STORE',c,c+80);});
 const inlay=new THREE.Mesh(new THREE.CircleGeometry(3.15,64),new THREE.MeshStandardMaterial({map:inlayT,transparent:true,metalness:0.6,roughness:0.3,depthWrite:false}));
 inlay.rotation.x=-Math.PI/2;inlay.position.y=0.01;scene.add(inlay);
 // 난간 (낮게 — 시야 안 가림)
 const GAP=Math.asin(3.1/(R_FLOOR-0.2));const rg=new THREE.TorusGeometry(R_FLOOR-0.2,0.05,8,160,Math.PI*2-GAP*2);rg.rotateZ(Math.PI/2+GAP);const rail=new THREE.Mesh(rg,GOLD());rail.rotation.x=Math.PI/2;rail.position.y=1.05;scene.add(rail);
 const gl=new THREE.Mesh(new THREE.CylinderGeometry(R_FLOOR-0.2,R_FLOOR-0.2,1.0,128,1,true,GAP,Math.PI*2-GAP*2),GLASS());gl.position.y=0.52;scene.add(gl);
 for(let i=0;i<48;i++){const a=i/48*Math.PI*2;if(a<GAP||a>Math.PI*2-GAP)continue;mesh(new THREE.CylinderGeometry(0.03,0.03,1.05,8),GOLD(),Math.sin(a)*(R_FLOOR-0.2),0.52,Math.cos(a)*(R_FLOOR-0.2));}
 // 공중 샹들리에 링 (빛 알갱이만 — 가림 없음)
 for(let k=0;k<3;k++){const n=60+k*30,r=4+k*2.2,y=12.5-k*0.8;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const s=glowSprite(pick([0xfff2d0,0xffe2a8,0xffffff]),0.55-k*0.08,scene,Math.sin(a)*r,y+Math.sin(i*1.7)*0.25,Math.cos(a)*r,0.85);chand.push({s,a,r,y,k,i});}}
 glowSprite(0xffd9a0,10,scene,0,12,0,0.12);
 const cl=new THREE.PointLight(0xffe2b8,0.9,30,1.3);cl.position.set(0,8,0);scene.add(cl);

 const big=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex(h.emoji),transparent:true,depthWrite:false}));big.scale.set(2.2,2.2,1);big.position.set(0,6.1,-1.5);back.add(big);
 glowSprite(h.glow,6,back,0,6.0,-1.6,0.35);
 occ(back,4.8);
 // 정문 아치 (금 기둥 + 간판)
 const arch=new THREE.Group();g.add(arch);
 [-3.9,3.9].forEach(x=>{mesh(new THREE.CylinderGeometry(0.16,0.2,5.2,20),GOLD(),x,2.6,3.4,arch);mesh(new THREE.BoxGeometry(0.6,0.25,0.6),GOLD(),x,0.12,3.4,arch);});
 const signT=ctex(1024,192,(x,w,hh)=>{x.fillStyle='#0a0a0c';x.fillRect(0,0,w,hh);x.strokeStyle='#d8b36a';x.lineWidth=6;x.strokeRect(10,10,w-20,hh-20);
  x.fillStyle='#e9cd8a';x.textAlign='center';x.textBaseline='middle';x.font='92px "Noto Serif KR",serif';x.fillText(h.name,w/2,hh/2-18);x.font='30px serif';x.fillStyle='#bfa06a';x.fillText(h.sub,w/2,hh/2+52);});
 mesh(new THREE.BoxGeometry(8.4,1.3,0.3),black,0,5.6,3.4,arch);
 const sm=new THREE.MeshStandardMaterial({map:signT,emissive:0xffffff,emissiveMap:signT,emissiveIntensity:0.55,roughness:0.3});
 const sign=new THREE.Mesh(new THREE.PlaneGeometry(8.0,1.5),sm);sign.position.set(0,5.6,3.56);arch.add(sign);

function parseCSV(t){const out=[];for(const raw of t.split(/\r?\n/)){const line=raw.trim();if(!line||line[0]==='#')continue;
 const cells=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else if(ch==='"')q=true;else if(ch===','){cells.push(cur);cur='';}else cur+=ch;}cells.push(cur);out.push(cells.map(s=>s.trim()));}
 if(out.length&&out[0][0]==='카테고리')out.shift();
 return out.map(r=>({cat:r[0]||'기타',name:r[1]||'',price:r[2]||'',link:/^https:\/\//i.test(r[3]||'')?r[3]:'',desc:r[4]||'',img:/^https:\/\//i.test(r[5]||'')?r[5]:'',org:r[6]||''})).filter(r=>r.name);}

 const t=new THREE.CanvasTexture(c);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}

function animFig(f,t,dt,holding){
 const u=f.userData,k=1-Math.exp(-dt*12);

 // 눈 깜빡

 if(u.mode==='walk'){u.ph+=dt*10.5;const s=Math.sin(u.ph);
  L(u.legs[0],'x',s*0.7);L(u.legs[1],'x',-s*0.7);
  if(!holding){L(u.arms[0],'x',-s*0.6);L(u.arms[1],'x',s*0.6);}
  u.rig.position.y=Math.abs(Math.cos(u.ph))*0.05;u.head.rotation.z=s*0.05;L(u.head,'y',0);}
 else if(u.mode==='sit'){L(u.legs[0],'x',-1.5);L(u.legs[1],'x',-1.5);
  if(!holding&&!u.talking){L(u.arms[0],'x',-0.7+Math.sin(t*1.3+u.off)*0.05);L(u.arms[1],'x',-0.7);}
  u.rig.position.y=Math.sin(t*1.8+u.off)*0.006;L(u.head,'y',Math.sin(t*0.5+u.off)*0.18);u.head.rotation.z=Math.sin(t*0.8+u.off)*0.05;}
 else{L(u.legs[0],'x',0);L(u.legs[1],'x',0);
  if(!holding){L(u.arms[0],'x',Math.sin(t*1.6+u.off)*0.06);L(u.arms[1],'x',-Math.sin(t*1.6+u.off)*0.06);}
  u.rig.position.y=Math.sin(t*2+u.off)*0.008;L(u.head,'y',Math.sin(t*0.45+u.off)*0.22);u.head.rotation.z=Math.sin(t*0.7+u.off)*0.04;}
 if(holding){L(u.arms[0],'x',-1.25);L(u.arms[1],'x',-1.25);}
 if(u.talking){u.talking-=dt;L(u.arms[0],'x',-1.0+Math.sin(t*6)*0.25);u.head.rotation.x=Math.sin(t*9)*0.05;if(u.talking<=0){u.talking=0;u.head.rotation.x=0;}}
}

 x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=10;x.fillStyle='#fffdf8';rr(x,(w-tw)/2,10,tw,h-52,36);x.fill();
 x.beginPath();x.moveTo(w/2-18,h-44);x.lineTo(w/2,h-12);x.lineTo(w/2+18,h-44);x.fill();x.shadowBlur=0;
 x.fillStyle='#3b3029';x.textAlign='center';x.textBaseline='middle';x.fillText(text,w/2,(h-42)/2+8);
 b.tex.needsUpdate=true;b.sp.visible=true;b.t=dur;b.pop=0;if(f.userData.mode==='sit'||f.userData.seer)f.userData.talking=Math.min(dur,1.6);}

function spawn(e,pos,n,o={}){
 for(let i=0;i<n;i++){const isGlow=typeof e==='number';
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:isGlow?glowTex:emojiTex(e),color:isGlow?e:0xffffff,transparent:true,depthWrite:false,blending:isGlow?THREE.AdditiveBlending:THREE.NormalBlending}));
  const s=(o.size||0.3)*rnd(0.7,1.2);sp.scale.set(s,s,1);sp.position.copy(pos).add(new THREE.Vector3(rnd(-1,1)*(o.jit||0.15),rnd(0,1)*(o.jit||0.15),rnd(-1,1)*(o.jit||0.15)));
  sp.renderOrder=15;scene.add(sp);
  particles.push({sp,v:new THREE.Vector3(rnd(-1,1)*(o.spread||0.6),(o.up||1.2)*rnd(0.7,1.3),rnd(-1,1)*(o.spread||0.6)),life:(o.life||1.4)*rnd(0.8,1.2),t:0,g:o.g||0,grow:o.grow||0,s,op:o.op||1});}}
function stepParticles(dt){
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;p.v.y-=p.g*dt;p.sp.position.addScaledVector(p.v,dt);
  const k=p.t/p.life;p.sp.material.opacity=p.op*(k<0.15?k/0.15:1-(k-0.15)/0.85);const sc=p.s*(1+p.grow*k);p.sp.scale.set(sc,sc,1);
  if(p.t>=p.life){scene.remove(p.sp);p.sp.material.dispose();particles.splice(i,1);}}}

const AU={ctx:null,master:null,mus:null,on:true};
function audioStart(){
 if(AU.ctx){AU.ctx.resume&&AU.ctx.resume();return;}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 const ctx=new C();AU.ctx=ctx;
 const master=ctx.createGain();master.gain.value=0;master.gain.setTargetAtTime(0.85,ctx.currentTime,1.2);master.connect(ctx.destination);AU.master=master;
 // 파도
 const len=ctx.sampleRate*8,buf=ctx.createBuffer(2,len,ctx.sampleRate);
 for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let l=0;for(let i=0;i<len;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.2;}
  const F=4000;for(let i=0;i<F;i++){const g=i/F;d[i]*=g;d[len-1-i]*=g;}}
 const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
 const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;
 const wg=ctx.createGain();wg.gain.value=0.04;
 const lfo=ctx.createOscillator();lfo.frequency.value=0.085;const lg=ctx.createGain();lg.gain.value=0.02;lfo.connect(lg);lg.connect(wg.gain);
 const lg2=ctx.createGain();lg2.gain.value=320;lfo.connect(lg2);lg2.connect(lp.frequency);
 src.connect(lp);lp.connect(wg);wg.connect(master);src.start();lfo.start();
 // 음악 버스 + 딜레이
 const mus=ctx.createGain();mus.gain.value=0.2;AU.mus=mus;
 const tone=ctx.createBiquadFilter();tone.type='lowpass';tone.frequency.value=2600;mus.connect(tone);tone.connect(master);
 const dl=ctx.createDelay();dl.delayTime.value=0.62;const fb=ctx.createGain();fb.gain.value=0.33;const dg=ctx.createGain();dg.gain.value=0.35;
 tone.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(dg);dg.connect(master);
 // 루프 스케줄러 (로파이 · 72BPM)
 const CH=[[53,57,60,64,67],[52,55,59,62,66],[50,53,57,60,64],[55,59,62,65,69]],PENTA=[72,76,79,81,83,86,88];
 const mf=n=>440*Math.pow(2,(n-69)/12);const SP=60/60/2;let next=ctx.currentTime+0.4,step=0;
 const note=(f,t,dur,type,vol,att)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(mus);o.start(t);o.stop(t+dur+0.05);};
 const tickOld=()=>{if(!AU.ctx)return;while(next<ctx.currentTime+0.35){const s=step%32,bar=Math.floor(step/8)%4;
  if(s%8===0){CH[bar].forEach(n=>{note(mf(n),next,SP*8.6,'sine',0.05,0.5);note(mf(n)*1.003,next,SP*8.6,'triangle',0.018,0.6);});note(mf(CH[bar][0]-12),next,SP*6,'sine',0.11,0.04);}
  if(s%8===4)note(mf(CH[bar][0]-12+7),next,SP*3,'sine',0.06,0.04);
  if(Math.random()<(s%2?0.18:0.34)){const n=pick(PENTA);note(mf(n),next,1.1,'triangle',0.05,0.008);note(mf(n)*2,next,0.5,'sine',0.012,0.005);}
  next+=SP;step++;}};
 const B=60/100;
 const nE=76,nG=79,nC=72,nD=74,nF=77;
 const MEL=[[nE,1],[nE,1],[nE,2],[nE,1],[nE,1],[nE,2],[nE,1],[nG,1],[nC,1.5],[nD,.5],[nE,4],
  [nF,1],[nF,1],[nF,1.5],[nF,.5],[nF,1],[nE,1],[nE,1],[nE,.5],[nE,.5],[nE,1],[nD,1],[nD,1],[nE,1],[nD,2],[nG,2],
  [nE,1],[nE,1],[nE,2],[nE,1],[nE,1],[nE,2],[nE,1],[nG,1],[nC,1.5],[nD,.5],[nE,4],
  [nF,1],[nF,1],[nF,1.5],[nF,.5],[nF,1],[nE,1],[nE,1],[nE,.5],[nE,.5],[nG,1],[nG,1],[nF,1],[nD,1],[nC,4]];
 const CHD={C:[48,52,55,59],F:[53,57,60,64],D7:[50,54,57,60],G7:[43,47,50,53]};
 const PROG=['C','C','C','C','F','C','D7','G7','C','C','C','C','F','C','G7','C'];
 const nb=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.14),ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,3);

   if(bb===0){c.forEach(n=>note(mf(n+12),bt,B*3.8,'sine',0.03,0.12));note(mf(c[0]-12),bt,B*1.8,'sine',0.11,0.02);}

  const s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=0.35;s.buffer=b;s.connect(g);g.connect(AU.master);s.start();}
 if(kind==='step'){tone(300,0.08,'sine',0.05);}
 if(kind==='clink'){[2637,3136,3951].forEach((f,i)=>tone(f,0.5,'sine',0.09,i*0.012));tone(2093,0.35,'triangle',0.05,0.09);[2637,3520].forEach((f,i)=>tone(f,0.4,'sine',0.06,0.14+i*0.01));}
 if(kind==='pour'){const b=ctx.createBuffer(1,ctx.sampleRate*1.9,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.min(1,i/4000)*(1-i/d.length*0.6);

  f.frequency.linearRampToValueAtTime(700,t+1.8);}}

/* ---------------- 같이 접속 (내 서버 없음 · 무료 공개 MQTT 중계소) ---------------- */
const PHRASES=['안녕하세요 👋','여기 명품관 같다 ✨','세일 뭐 있어요?','쿠팡관 가봐요 🚀','알리관 구경 ✈️','핫딜관 털자 🔥','같이 사진 찍어요 📸','또 만나요 👋'];
const BROKERS=window.TEST_BROKERS||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const NET={c:null,ok:false,id:Math.random().toString(36).slice(2,10),topic:'lia-online-department/v1/main',peers:new Map(),hb:0,since:9,lastKey:'',lod:0};
const FULL_MAX=(Math.min(innerWidth,innerHeight)<600)?12:22;
const cleanName=n=>String(n||'손님').replace(/[\u0000-\u001f<>&"'`\\]/g,'').slice(0,8)||'손님';
function setOnline(){const el=document.getElementById('online'),n=document.getElementById('onN');
 if(!NET.ok){el.classList.remove('live');n.textContent=NET.tried?'혼자 모드':'연결 중…';return;}
 el.classList.add('live');n.textContent='👥 '+(NET.peers.size+1)+'명 접속';}
async function netStart(){
 if(NET.started)return;NET.started=true;
 if(!window.mqtt){for(const u of [window.LOCAL_MQTT,'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js'].filter(Boolean)){try{await loadScript(u);if(window.mqtt)break;}catch(e){}}}
 if(!window.mqtt){NET.tried=true;setOnline();return;}
 tryBroker(0);
 addEventListener('pagehide',()=>{if(NET.ok)pub({t:'bye',i:NET.id});});
}
function tryBroker(i){
 if(i>=BROKERS.length){NET.tried=true;setOnline();setTimeout(()=>tryBroker(0),20000);return;}
 let settled=false;
 const c=mqtt.connect(BROKERS[i],{clientId:'yjp_'+NET.id+'_'+i,clean:true,connectTimeout:6000,reconnectPeriod:0,keepalive:30,
  will:{topic:NET.topic,payload:JSON.stringify({t:'bye',i:NET.id}),qos:0,retain:false}});
 const fail=()=>{if(settled)return;settled=true;try{c.end(true);}catch(e){}tryBroker(i+1);};
 const to=setTimeout(fail,7500);
 c.on('connect',()=>{if(NET.c&&NET.c!==c)return;if(!settled){settled=true;clearTimeout(to);}
  NET.c=c;NET.ok=true;c.options.reconnectPeriod=4000;c.subscribe(NET.topic,{qos:0});NET.hb=0;NET.lastKey='';setOnline();
  toast('👥 같이 접속 연결됨 · 다른 손님들도 쇼핑 중이에요');});
 c.on('error',()=>{if(!NET.ok)fail();});
 c.on('close',()=>{if(NET.c===c&&NET.ok){NET.ok=false;setOnline();}});
 c.on('message',(tp,buf)=>onNet(buf));
}
function netSend(dt){if(!NET.ok)return;NET.hb-=dt;NET.since+=dt;const p=player.f.position,u=player.f.userData;
 const m=u.mode==='walk'?1:u.mode==='sit'?2:0;
 const s={t:'s',i:NET.id,n:myName,c:myColor,x:+p.x.toFixed(2),z:+p.z.toFixed(2),y:+p.y.toFixed(2),r:+player.f.rotation.y.toFixed(2),m,h:player.holding?1:0};
 const key=[s.x,s.z,s.r,m,s.h,myColor,myName].join();
 if((key!==NET.lastKey&&NET.since>0.19)||NET.hb<0){pub(s);NET.lastKey=key;NET.since=0;NET.hb=2.5;}}
setInterval(()=>{try{netSend(0.2);}catch(e){}},200);
function pub(o){if(!NET.c||!NET.ok)return;try{NET.c.publish(NET.topic,JSON.stringify(o),{qos:0});}catch(e){}}
function netEvent(k,v){pub({t:'e',i:NET.id,k,v:v|0});}
function netTick(dt,t){
 // 내 상태 보내기 (움직일 때 5번/초, 가만히 있으면 2.5초마다)
 // 다른 손님 정리 · 움직임
 const now=performance.now();let changed=false;
 NET.peers.forEach((pe,id)=>{if(now-pe.seen>9000){removePeer(id);changed=true;}});
 if(changed)setOnline();
 NET.lod-=dt;if(NET.lod<0){NET.lod=0.5;updateLOD();}
 const k=1-Math.exp(-dt*8);
 NET.peers.forEach(pe=>{
  const d=Math.hypot(pe.tx-pe.pos.x,pe.tz-pe.pos.z);
  if(d>4){pe.pos.x=pe.tx;pe.pos.z=pe.tz;}else{pe.pos.x+=(pe.tx-pe.pos.x)*k;pe.pos.z+=(pe.tz-pe.pos.z)*k;}
  pe.pos.y+=(pe.ty-pe.pos.y)*k;pe.rot+=angDiff(pe.rot,pe.tr)*k;
  const moving=d>0.05&&pe.m!==2;
  let jump=0,spin=0;if(pe.react){pe.reactT+=dt;if(pe.react==='happy'){jump=Math.abs(Math.sin(pe.reactT*9))*0.4;spin=pe.reactT*7;}if(pe.reactT>1.5)pe.react=null;}
  const obj=pe.full&&pe.full.visible?pe.full:pe.lite;
  obj.position.set(pe.pos.x,pe.pos.y+(obj===pe.lite?jump:0),pe.pos.z);obj.rotation.y=pe.rot+(obj===pe.lite?spin:0);
  if(obj===pe.full){const u=pe.full.userData;u.mode=pe.m===2?'sit':moving?'walk':'stand';animFig(pe.full,t,dt,pe.h&&pe.m!==2);
   pe.tray.visible=pe.h&&pe.m!==2;u.rig.rotation.y=spin;if(jump)u.rig.position.y=jump;
   if(pe.react==='cry'){u.rig.rotation.z=Math.sin(pe.reactT*12)*0.07;}else u.rig.rotation.z=0;}
 });
}
const liteGeo={};const liteMat={};
function liteFigure(c){
 if(!liteGeo.b){liteGeo.b=new THREE.CylinderGeometry(0.17,0.32,0.95,10);liteGeo.b.translate(0,0.48,0);liteGeo.h=new THREE.SphereGeometry(0.27,12,10);liteGeo.h.translate(0,1.22,0);liteGeo.hr=new THREE.SphereGeometry(0.285,12,8,0,Math.PI*2,0,Math.PI*0.55);liteGeo.hr.rotateX(-0.38);liteGeo.hr.translate(0,1.235,0);liteMat.skin=M(0xf2c9a0,0.6);liteMat.hair=M(0x2a2018,0.85);}
 if(!liteMat[c])liteMat[c]=M(c,0.8);
 const g=new THREE.Group();g.add(new THREE.Mesh(liteGeo.b,liteMat[c]),new THREE.Mesh(liteGeo.h,liteMat.skin),new THREE.Mesh(liteGeo.hr,liteMat.hair));scene.add(g);return g;}
function addPeer(o){
 const c=OUTFITS.includes(o.c)?o.c:OUTFITS[0];
 const pe={id:o.i,n:cleanName(o.n),c,pos:new THREE.Vector3(+o.x||0,0,+o.z||0),tx:0,tz:0,ty:0,tr:0,rot:+o.r||0,m:0,h:false,seen:performance.now(),full:null,lite:liteFigure(c),react:null,reactT:0};
 NET.peers.set(o.i,pe);setOnline();return pe;}
function makePeerFull(pe){
 const f=makeFigure({robe:pe.c,top:0xf6efe4,hair:0x2a2018,skin:0xf2c9a0,style:'p',ribbon:0x3b3029});
 f.traverse(m=>{if(m.isMesh)m.castShadow=false;});
 addTag(f,pe.n,0,1.98,false);addBubble(f,2.5);
 const tr=new THREE.Group();tr.position.set(0,0.98,0.34);tr.visible=false;f.userData.rig.add(tr);
 mesh(new THREE.BoxGeometry(0.44,0.025,0.3),M(0x8a5a3c,0.6),0,0,0,tr).castShadow=false;
 const br=mesh(new THREE.SphereGeometry(0.09,10,8),M(0xe0ac5e,0.85),-0.09,0.05,0,tr);br.scale.set(1.4,0.6,1);br.castShadow=false;
 pe.tray=tr;scene.add(f);pe.full=f;}
function disposeObj(o){scene.remove(o);o.traverse(m=>{if(m.isMesh||m.isSprite){if(m.geometry&&m.geometry!==liteGeo.b&&m.geometry!==liteGeo.h&&m.geometry!==liteGeo.hr)m.geometry.dispose();
 if(m.material&&!Object.values(liteMat).includes(m.material)){if(m.material.map&&m.material.map!==glowTex)m.material.map.dispose();m.material.dispose();}}});}
function removePeer(id){const pe=NET.peers.get(id);if(!pe)return;if(pe.full)disposeObj(pe.full);scene.remove(pe.lite);NET.peers.delete(id);setOnline();}
function updateLOD(){
 const arr=[...NET.peers.values()];const cp=camera.position;
 arr.forEach(pe=>pe.dd=pe.pos.distanceToSquared(cp));arr.sort((a,b)=>a.dd-b.dd);
 arr.forEach((pe,i)=>{const near=i<FULL_MAX;
  if(near&&!pe.full)makePeerFull(pe);
  if(pe.full)pe.full.visible=near;pe.lite.visible=!near;
  if(!near&&pe.full&&i>FULL_MAX+15){disposeObj(pe.full);pe.full=null;}});
}
function peerFulls(){const r=[];NET.peers.forEach(pe=>{if(pe.full&&pe.full.visible)r.push({f:pe.full});});return r;}
function onNet(buf){
 if(!buf||buf.length>400)return;let o;try{o=JSON.parse(buf.toString());}catch(e){return;}
 if(!o||typeof o.i!=='string'||o.i.length>16||o.i===NET.id)return;
 if(o.t==='bye'){removePeer(o.i);return;}
 let pe=NET.peers.get(o.i);
 if(o.t==='s'){
  if(!pe){if(NET.peers.size>=150)return;pe=addPeer(o);pe.pos.set(clamp(+o.x||0,-8,8),0,clamp(+o.z||0,-8,8));}
  pe.seen=performance.now();pe.tx=clamp(+o.x||0,-8,8);pe.tz=clamp(+o.z||0,-8,8);pe.ty=clamp(+o.y||0,0,1);pe.tr=+o.r||0;pe.m=o.m|0;pe.h=!!o.h;
  const nm=cleanName(o.n);const col=OUTFITS.includes(o.c)?o.c:pe.c;
  if(nm!==pe.n||col!==pe.c){pe.n=nm;pe.c=col;if(pe.full){disposeObj(pe.full);pe.full=null;}scene.remove(pe.lite);pe.lite=liteFigure(col);NET.lod=0;}
 }else if(o.t==='e'&&pe){pe.seen=performance.now();
  if(o.k==='say'){const ph=PHRASES[o.v|0];if(ph&&pe.full&&pe.full.visible)say(pe.full,ph,3);}
  else if(o.k==='happy'||o.k==='cry'){pe.react=o.k;pe.reactT=0;
   if(pe.full&&pe.full.visible)say(pe.full,o.k==='happy'?'😆':'😭',1.5);}}
}


/* ---------------- 로더 ---------------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
(async function(){
 const cdns=["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js","https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"];
 if(window.LOCAL_THREE)cdns.unshift(window.LOCAL_THREE);
 let ok=false;for(const u of cdns){try{await loadScript(u);if(window.THREE){ok=true;break;}}catch(e){}}
 const boot=document.getElementById('boot');
 if(!ok){boot.innerHTML='<h1>🔮 양자팔자 사주카페</h1><p>3D 엔진 로딩 실패 — 새로고침하거나 크롬에서 열어주세요</p>';return;}
 try{await Promise.race([document.fonts?document.fonts.load('40px "Jua"'):0,new Promise(r=>setTimeout(r,1500))]);}catch(e){}
 try{init();}catch(err){console.error(err);boot.innerHTML='<h1>⚠️ 오류</h1><p style="max-width:80%;text-align:center;line-height:1.5">'+(err&&err.message||err)+'</p>';return;}
 setTimeout(()=>{boot.style.opacity=0;setTimeout(()=>boot.remove(),600);},400);
})();
