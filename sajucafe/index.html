<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>양자팔자 사주카페 · 오션뷰</title>
<meta name="description" content="바다 보이는 3D 카페에서 역술가 네 분께 사주 보기">
<meta property="og:title" content="🔮 양자팔자 사주카페 · 오션뷰">
<meta property="og:description" content="노을 지는 바다 앞 3D 카페. 빵 하나 들고 역술가 네 분께 사주 보러 오세요.">
<meta name="theme-color" content="#2f3a78">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b3029;--cream:#fffaf3;--accent:#a95e42;--gold:#e8b65a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1b2240;
  font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none;}
#app{position:fixed;inset:0;}
canvas{display:block;}
.jua{font-family:'Jua','Noto Sans KR',sans-serif;}
.glass{background:rgba(255,250,243,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(20,14,30,.22);border:1px solid rgba(255,255,255,.6);}

/* 상단 */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;
  align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 12px 0;pointer-events:none;opacity:0;transition:opacity .8s;}
#hud.on{opacity:1;}
#hud>*{pointer-events:auto;}
#sign{border-radius:18px;padding:8px 14px 9px;color:var(--ink);}
#sign b{font-family:'Jua',sans-serif;font-weight:400;font-size:18px;display:block;line-height:1.15;}
#sign small{font-size:11px;opacity:.7;font-weight:700;}
#stamps{display:flex;gap:5px;margin-top:6px;align-items:center;font-size:11px;font-weight:800;color:var(--ink);}
#stamps i{width:15px;height:15px;border-radius:50%;border:2px dashed rgba(59,48,41,.35);display:inline-block;transition:all .4s;}
#stamps i.on{border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 0 10px currentColor;transform:scale(1.15);}
#right{display:flex;flex-direction:column;gap:7px;align-items:flex-end;}
#times{display:flex;border-radius:16px;padding:3px;gap:2px;}
#times button,#snd{border:none;background:transparent;font-size:17px;width:36px;height:32px;border-radius:12px;cursor:pointer;transition:all .2s;}
#times button.on{background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25);}
#snd{border-radius:14px;width:42px;height:38px;}
#online{border-radius:14px;padding:6px 11px;font-size:12px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:6px;}
#online .dot{width:8px;height:8px;border-radius:50%;background:#aaa;}
#online.live .dot{background:#2ecc71;box-shadow:0 0 8px #2ecc71;animation:blink 1.6s infinite;}
@keyframes blink{50%{opacity:.4}}
#talk{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px) scale(.96);z-index:25;
  border-radius:20px;padding:10px;width:min(340px,92vw);display:grid;grid-template-columns:1fr 1fr;gap:6px;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.9,.3,1.3);}
#talk.open{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
#talk button{border:none;border-radius:12px;padding:9px 6px;background:#fff;color:var(--ink);font-family:'Jua',sans-serif;font-size:14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);}
#talk button.emo{background:linear-gradient(160deg,#fff4dc,#ffd9a8);}
#talk button:active{transform:scale(.94);}

/* 토스트 */
#hint{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);
  color:var(--ink);padding:10px 18px;border-radius:16px;font-size:13.5px;font-weight:700;z-index:20;
  opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;max-width:90%;text-align:center;line-height:1.45;}
#hint.show{opacity:1;transform:translate(-50%,0);}

/* 하단 바 */
#bar{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:6px;
  padding:14px 8px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(20,16,36,.55),transparent);opacity:0;transform:translateY(30px);transition:all .7s .2s;}
#bar.on{opacity:1;transform:none;}
.btn{border:none;border-radius:16px;padding:8px 2px 7px;min-width:54px;flex:0 1 64px;color:var(--ink);
  font-family:'Jua',sans-serif;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:transform .1s;}
.btn:active{transform:scale(.9);}
.btn .ic{font-size:21px;line-height:1.1;}
.btn.hot{background:linear-gradient(160deg,#fff4dc,#ffd9a8);}

/* 입장 */
#enter{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 120%,rgba(255,150,100,.55),rgba(30,30,80,.55) 70%);transition:opacity .7s;}
#enter.hide{opacity:0;pointer-events:none;}
#ecard{width:100%;max-width:360px;border-radius:26px;padding:24px 22px 20px;text-align:center;color:var(--ink);
  background:rgba(255,250,243,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(10,8,30,.45);
  animation:pop .7s cubic-bezier(.2,.9,.3,1.2);}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
#ecard .orb{width:62px;height:62px;margin:0 auto 8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#c9b6ff 30%,#6b4fb8 70%,#2c1f5c);box-shadow:0 0 30px #a98bff,0 0 60px rgba(169,139,255,.5);
  animation:glow 2.4s ease-in-out infinite;}
@keyframes glow{50%{box-shadow:0 0 40px #ffcf8a,0 0 80px rgba(255,180,120,.6);transform:scale(1.05)}}
#ecard h1{font-family:'Jua',sans-serif;font-weight:400;font-size:27px;}
#ecard p.sub{font-size:13px;opacity:.7;margin:4px 0 16px;font-weight:700;}
#ecard label{display:block;text-align:left;font-size:12px;font-weight:800;opacity:.7;margin:10px 2px 6px;}
#nick{width:100%;border:2px solid #eadfcf;border-radius:14px;padding:11px 14px;font-size:16px;font-family:inherit;font-weight:700;
  background:#fff;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;}
#nick:focus{border-color:#e8a46a;}
#sw{display:flex;gap:9px;justify-content:center;}
#sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .15s;}
#sw button.on{transform:scale(1.18);box-shadow:0 0 0 3px var(--ink);}
#go{margin-top:18px;width:100%;border:none;border-radius:16px;padding:14px;font-family:'Jua',sans-serif;font-size:19px;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,#f08a5d,#b54e72 55%,#5b4bb0);box-shadow:0 10px 24px rgba(181,78,114,.45);}
#go:active{transform:scale(.97);}
#ecard .tip{font-size:11px;opacity:.55;margin-top:10px;font-weight:700;}

/* 사주 오버레이 */
#overlay{position:absolute;inset:0;z-index:50;display:none;background:rgba(18,14,30,.6);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);flex-direction:column;align-items:center;justify-content:center;padding:12px;}
#overlay.open{display:flex;animation:fade .3s;}
@keyframes fade{from{opacity:0}}
#card{width:100%;max-width:440px;height:92%;max-height:860px;background:var(--cream);border-radius:22px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.2,.9,.3,1.2);}
#cardhead{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff6e9;}
#cardhead .who{font-family:'Jua',sans-serif;font-size:18px;}
#cardhead .tone{font-size:11px;opacity:.9;font-weight:700;}
#cardhead .sp{flex:1;}
#cardhead button{background:rgba(255,255,255,.2);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;}
#frameWrap{flex:1;position:relative;background:#fff;}
#frameWrap iframe{width:100%;height:100%;border:none;}
#frameLoad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  color:var(--ink);font-family:'Jua',sans-serif;font-size:16px;background:var(--cream);}
.spin{width:38px;height:38px;border:4px solid #e7ddcf;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#react{display:flex;gap:8px;padding:10px 14px;background:var(--cream);border-top:1px solid #ece2d4;}
#react button{flex:1;border:none;border-radius:13px;padding:10px;font-family:'Jua',sans-serif;font-size:14px;cursor:pointer;background:#f0e7d9;color:var(--ink);}
#react button:active{transform:scale(.95);}

#flash{position:absolute;inset:0;background:#fff;z-index:70;opacity:0;pointer-events:none;transition:opacity .5s;}
#flash.on{opacity:1;transition:none;}

#boot{position:absolute;inset:0;z-index:99;background:linear-gradient(#2f3a78,#c9707a 70%,#ffb27a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;transition:opacity .6s;}
#boot h1{font-family:'Jua',sans-serif;font-weight:400;font-size:26px;}
#boot p{font-size:13px;opacity:.85;font-weight:700;}
#boot .spin{border-color:rgba(255,255,255,.3);border-top-color:#fff;}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="sign" class="glass">
    <b>🔮 양자팔자 사주카페</b><small>오션뷰 베이커리 · <span id="who">손님</span>님 입장 중</small>
    <div id="stamps">사주 도장 <i></i><i></i><i></i><i></i></div>
  </div>
  <div id="right">
    <div id="times" class="glass">
      <button data-t="day" title="낮">☀️</button><button data-t="sunset" class="on" title="노을">🌅</button><button data-t="night" title="밤">🌙</button>
    </div>
    <button id="snd" class="glass" title="소리">🔊</button>
    <div id="online" class="glass"><span class="dot"></span><span id="onN">연결 중…</span></div>
  </div>
</div>

<div id="hint" class="glass"></div>

<div id="bar">
  <button class="btn glass" id="bOrder"><span class="ic">🥐</span>빵 주문</button>
  <button class="btn glass" id="bBar"><span class="ic">🌊</span>창가석</button>
  <button class="btn glass hot" id="bSaju"><span class="ic">🔮</span>사주</button>
  <button class="btn glass" id="bTalk"><span class="ic">💬</span>말하기</button>
  <button class="btn glass" id="bSnap"><span class="ic">📸</span>사진</button>
</div>

<div id="talk" class="glass"></div>

<div id="enter">
  <div id="ecard">
    <div class="orb"></div>
    <h1>양자팔자 사주카페</h1>
    <p class="sub">노을 지는 바다 앞, 역술가 네 분이 기다려요</p>
    <label>내 이름</label>
    <input id="nick" maxlength="8" placeholder="손님" autocomplete="off">
    <label>오늘의 한복 색</label>
    <div id="sw"></div>
    <button id="go">🌅 카페 입장하기</button>
    <div class="tip">🔊 파도 소리와 음악이 나와요 · 바닥 끌면 360° 회전</div>
  </div>
</div>

<div id="overlay">
  <div id="card">
    <div id="cardhead">
      <div><div class="who" id="whoName">마라맛 아주머니</div><div class="tone" id="whoTone">🌶 매운 직설 사주</div></div>
      <div class="sp"></div><button id="closeCard">×</button>
    </div>
    <div id="frameWrap">
      <div id="frameLoad"><div class="spin"></div><div>역술가님 모시는 중…</div></div>
      <iframe id="sajuFrame" src="about:blank" allow="clipboard-write"></iframe>
    </div>
    <div id="react">
      <button id="rHappy">😊 좋은 괘가 나왔다!</button>
      <button id="rCry">😭 아이고…</button>
    </div>
  </div>
</div>

<div id="flash"></div>
<div id="boot"><div class="spin"></div><h1>🔮 양자팔자 사주카페</h1><p>바닷가에 카페 짓는 중…</p></div>

<script>

const SAJU={normal:"https://7468rrfy7y-wq.github.io/yangjapalja/saju/",mara:"https://7468rrfy7y-wq.github.io/yangjapalja/saju-mara/"};

 {id:'mara_w',name:'마라맛 아주머니',tone:'🌶 매운 직설 사주',url:SAJU.mara,color:0xc0392b,robe:0xd94f4f,top:0xf6d77a,ribbon:0x8e2b22,hair:0x1e1a17,skin:0xf2c9a0,style:'f',pos:[-3.9,-1.3],cloth:0x7a2a24,
  lines:['어디 보자… 올해 돈복 터졌네!','그 사람? 놓아라, 인연 아이다','생년월일 똑바로 대라 🌶','팔자에 불이 활활~ 🔥']},

  lines:['팩트만 말한다. 각오됐나?','이직운 있다. 근데 니가 안 움직이지','돈은 들어오는데 새는 구멍이 크다','고집 좀 내려놔라 🌶']},
 {id:'mild_w',name:'보통맛 아주머니',tone:'☕ 따뜻한 순한 사주',url:SAJU.normal,color:0x68785c,robe:0x8aa17a,top:0xf6e8cc,ribbon:0xc96f6f,hair:0x3a2a1a,skin:0xf2c9a0,style:'f',pos:[-3.9,2.1],cloth:0x4f5d45,
  lines:['천천히 봐요, 차 한 잔 하면서~','지금 잘하고 있어요 ☺️','봄에 좋은 소식 있겠네요','마음이 참 따뜻한 사주예요']},
 {id:'mild_m',name:'보통맛 아저씨',tone:'☕ 차분한 순한 사주',url:SAJU.normal,color:0x4a6fa5,robe:0x5b7fb0,top:0xe9eef5,ribbon:0x2f4a73,hair:0x222018,skin:0xe6b98a,style:'m',pos:[3.9,2.1],cloth:0x34507a,
  lines:['허허, 편히 앉으시게','큰 흐름은 좋아요. 걱정 마세요','물 기운이 도와주는 해입니다 🌊','서두르지 않으면 다 됩니다']},
];
const OUTFITS=[0x3b6ea5,0xe0607e,0x6aa37a,0xe8a23c,0x8a6cc8,0x2f2a3a];
const BREADS=[{n:'소금빵',c:0xe0ac5e},{n:'크루아상',c:0xd38a38},{n:'앙버터',c:0xc9934f},{n:'바다 마들렌',c:0xe9c070},{n:'쑥 스콘',c:0x9aa86a}];

const W=14,D=11,HW=7,HD=5.5;
let scene,camera,renderer,raycaster,pointer,clock;
let skyMat,oceanMat,sunLight,hemi,amb,stars,lightBeam,lhLamp;
const lampMats=[],lampGlows=[],lampLights=[],flames=[],walls=[],clickables=[],floorHits=[],outsideHits=[],OBST=[];
const agents=[],npcs=[],seerObjs=[],particles=[],gulls=[];

let camAngle=-0.9,camTilt=0.95,camDist=30,camGoal=null,camTarget;
let dragging=false,dragMoved=false,lastX=0,lastY=0,downX=0,downY=0,downT=0,pinchD=0;
let nearSeer=null,react=null,reactT=0,sajuToken=0,currentSeer=null,entered=false;
const visited=new Set();
let myName='손님',myColor=OUTFITS[0];

/* ---------------- 시간대 프리셋 ---------------- */
const PRE={
 day:   {top:0x3d8fd6,bot:0xd5ecf0,sun:0xfff1d0,light:0xfff3e0,dir:[0.35,0.62,-0.7],sunI:1.15,hs:0xeaf6ff,hg:0xcdb593,hi:0.72,deep:0x0b5f8a,shal:0x34b6c6,lamp:0.12,stars:0,glow:0.6,disc:1.0},
 sunset:{top:0x2f3a78,bot:0xffa877,sun:0xffa060,light:0xffb27a,dir:[-0.22,0.10,-0.97],sunI:1.0,hs:0xffd2b4,hg:0x5b4252,hi:0.62,deep:0x24315f,shal:0xd27c63,lamp:0.85,stars:0.25,glow:1.5,disc:1.0},
 night: {top:0x050916,bot:0x1b2b52,sun:0xdfe8ff,light:0x9db2ff,dir:[0.32,0.30,-0.9],sunI:0.3,hs:0x34467a,hg:0x140f1c,hi:0.38,deep:0x040916,shal:0x10285a,lamp:1.7,stars:1,glow:0.55,disc:0.75},
};
const CUR={};let timeKey='sunset';
function initCur(p){for(const k in p){const v=p[k];CUR[k]=Array.isArray(v)?new THREE.Vector3(...v):typeof v==='number'&&k.match(/^(top|bot|sun|light|hs|hg|deep|shal)$/)?new THREE.Color(v):v;}}
function stepCur(dt){
 const P=PRE[timeKey],k=1-Math.exp(-dt*1.6);
 for(const key in P){const v=P[key];const c=CUR[key];
  if(c instanceof THREE.Color)c.lerp(new THREE.Color(v),k);
  else if(c instanceof THREE.Vector3)c.lerp(new THREE.Vector3(...v),k).normalize();
  else CUR[key]=c+(v-c)*k;}
}

/* ---------------- 유틸 ---------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hex=c=>'#'+c.toString(16).padStart(6,'0');
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function M(c,r=0.8,extra){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r},extra||{}));}
function mesh(geo,mat,x=0,y=0,z=0,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);
 const t=new THREE.CanvasTexture(c);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const FONT='"Jua","Noto Sans KR",sans-serif';
let glowTex;
function glowTexture(){return ctex(128,128,(x,w)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);});}
const emojiCache={};

let sky;
function buildSky(){
 skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{uTop:{value:new THREE.Color()},uBot:{value:new THREE.Color()},uSun:{value:new THREE.Color()},uDir:{value:new THREE.Vector3(0,.1,-1)},uGlow:{value:1},uDisc:{value:1}},
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 uTop,uBot,uSun,uDir;uniform float uGlow,uDisc;varying vec3 vP;
  void main(){vec3 d=normalize(vP);float h=d.y;
   vec3 col=mix(uBot,uTop,smoothstep(-0.02,0.6,h));
   float s=max(dot(d,normalize(uDir)),0.);
   col+=uSun*(pow(s,5.)*0.28*uGlow+pow(s,48.)*0.45*uGlow);
   col=mix(col,uSun*1.15+0.15,smoothstep(0.99935,0.99965,s)*uDisc);
   col=mix(col,uBot*0.92,smoothstep(0.0,-0.08,h));
   gl_FragColor=vec4(col,1.);}`});
 sky=new THREE.Mesh(new THREE.SphereGeometry(180,40,20),skyMat);sky.renderOrder=-10;scene.add(sky);
 // 별
 const N=900,pos=new Float32Array(N*3);
 for(let i=0;i<N;i++){const th=Math.random()*Math.PI*2,ph=Math.acos(rnd(0.05,1));pos[i*3]=Math.sin(ph)*Math.cos(th)*170;pos[i*3+1]=Math.cos(ph)*170;pos[i*3+2]=Math.sin(ph)*Math.sin(th)*170;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 stars=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));
 scene.add(stars);
}

function waveH(x,z,t){return Math.sin(x*0.35+t*1.1)*0.16+Math.sin(z*0.5-t*1.3+x*0.2)*0.11+Math.sin((x+z)*1.2+t*2.0)*0.035;}
function buildOcean(){
 oceanMat=new THREE.ShaderMaterial({extensions:{derivatives:true},
  uniforms:{uTime:{value:0},uDeep:{value:new THREE.Color()},uShal:{value:new THREE.Color()},uSky:{value:new THREE.Color()},uSun:{value:new THREE.Color()},uDir:{value:new THREE.Vector3()},uFog:{value:new THREE.Color()}},
  vertexShader:`uniform float uTime;varying vec3 vW;varying float vH;
   float wv(vec2 p){return sin(p.x*0.35+uTime*1.1)*0.16+sin(p.y*0.5-uTime*1.3+p.x*0.2)*0.11+sin((p.x+p.y)*1.2+uTime*2.0)*0.035;}
   void main(){vec4 w=modelMatrix*vec4(position,1.);float h=wv(w.xz);w.y+=h;vH=h;vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform float uTime;uniform vec3 uDeep,uShal,uSky,uSun,uDir,uFog;varying vec3 vW;varying float vH;
   void main(){vec3 n=normalize(cross(dFdx(vW),dFdy(vW)));if(n.y<0.)n=-n;
    vec3 V=normalize(cameraPosition-vW);
    float fr=pow(1.-max(dot(n,V),0.),3.);
    vec3 col=mix(uDeep,uShal,clamp(vH*2.2+.42,0.,1.));
    col=mix(col,uSky,fr*.55);
    vec3 R=reflect(-V,n);float sp=max(dot(R,normalize(uDir)),0.);
    col+=uSun*(pow(sp,140.)*2.2+pow(sp,14.)*0.18);
    float shore=smoothstep(-15.5,-12.2,vW.z);
    float fo=smoothstep(.55,1.,sin(vW.z*3.2+uTime*1.8+sin(vW.x*.6+uTime*.5)*2.2)*.5+.5);
    col=mix(col,vec3(1.,.98,.95),fo*shore*.55+smoothstep(-12.9,-12.2,vW.z)*.35);
    float dist=length(vW.xz-cameraPosition.xz);
    col=mix(col,uFog,smoothstep(35.,175.,dist));
    gl_FragColor=vec4(col,1.);}`});
 const o=new THREE.Mesh(new THREE.PlaneGeometry(320,190,200,110),oceanMat);
 o.rotation.x=-Math.PI/2;o.position.set(0,-0.42,-12-95);scene.add(o);outsideHits.push(o);
}

function animFig(f,t,dt,holding){
 const u=f.userData,k=1-Math.exp(-dt*12);
 const L=(o,ax,v)=>{o.rotation[ax]+=(v-o.rotation[ax])*k;};

 if(u.mode==='walk'){u.ph+=dt*10.5;const s=Math.sin(u.ph);
  L(u.legs[0],'x',s*0.7);L(u.legs[1],'x',-s*0.7);
  if(!holding){L(u.arms[0],'x',-s*0.6);L(u.arms[1],'x',s*0.6);}
  u.rig.position.y=Math.abs(Math.cos(u.ph))*0.05;u.head.rotation.z=s*0.05;L(u.head,'y',0);}
 else if(u.mode==='sit'){L(u.legs[0],'x',-1.5);L(u.legs[1],'x',-1.5);
  if(!holding&&!u.talking){L(u.arms[0],'x',-0.7+Math.sin(t*1.3+u.off)*0.05);L(u.arms[1],'x',-0.7);}
  u.rig.position.y=Math.sin(t*1.8+u.off)*0.006;L(u.head,'y',Math.sin(t*0.5+u.off)*0.18);u.head.rotation.z=Math.sin(t*0.8+u.off)*0.05;}
 else{L(u.legs[0],'x',0);L(u.legs[1],'x',0);
  if(!holding){L(u.arms[0],'x',Math.sin(t*1.6+u.off)*0.06);L(u.arms[1],'x',-Math.sin(t*1.6+u.off)*0.06);}
  u.rig.position.y=Math.sin(t*2+u.off)*0.008;L(u.head,'y',Math.sin(t*0.45+u.off)*0.22);u.head.rotation.z=Math.sin(t*0.7+u.off)*0.04;}
 if(holding){L(u.arms[0],'x',-1.25);L(u.arms[1],'x',-1.25);}
 if(u.talking){u.talking-=dt;L(u.arms[0],'x',-1.0+Math.sin(t*6)*0.25);u.head.rotation.x=Math.sin(t*9)*0.05;if(u.talking<=0){u.talking=0;u.head.rotation.x=0;}}
}

function mkAgent(f,x,z,speed){f.position.set(x,0,z);scene.add(f);const a={f,speed,target:null,cb:null,stuck:0,holding:false,seatInfo:null};agents.push(a);return a;}
function sitAgent(a,x,z,yaw,y){a.f.position.set(x,y,z);a.f.rotation.y=yaw;a.f.userData.mode='sit';a.target=null;}
function standAgent(a){if(a.f.userData.mode!=='sit')return;a.f.userData.mode='stand';a.f.position.y=0;
 if(a.seatInfo){a.f.position.x=a.seatInfo.ax;a.f.position.z=a.seatInfo.az;a.seatInfo=null;}}
function walkAgent(a,x,z,cb){standAgent(a);a.target=new THREE.Vector3(x,0,z);a.cb=cb||null;a.stuck=0;}
function pushOut(p,r,self){
 for(const o of OBST){const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz),m=o.r+r;if(d<m&&d>1e-4){p.x=o.x+dx/d*m;p.z=o.z+dz/d*m;}}
 for(const a of agents){if(a.f===self||a.f.userData.mode==='sit'||!a.f.visible)continue;const q=a.f.position,dx=p.x-q.x,dz=p.z-q.z,d=Math.hypot(dx,dz),m=0.55;if(d<m&&d>1e-4){p.x+=dx/d*(m-d)*0.5;p.z+=dz/d*(m-d)*0.5;}}
 p.x=clamp(p.x,-6.5,6.5);p.z=clamp(p.z,-4.3,3.65);}
function moveAgent(a,dt){
 const u=a.f.userData;if(u.mode==='sit')return;
 if(!a.target){u.mode='stand';return;}
 const p=a.f.position,dx=a.target.x-p.x,dz=a.target.z-p.z,dist=Math.hypot(dx,dz);
 if(dist>0.07){const st=Math.min(a.speed*dt,dist),ox=p.x,oz=p.z;p.x+=dx/dist*st;p.z+=dz/dist*st;pushOut(p,0.3,a.f);
  a.f.rotation.y+=angDiff(a.f.rotation.y,Math.atan2(dx,dz))*Math.min(1,dt*10);u.mode='walk';
  const moved=Math.hypot(p.x-ox,p.z-oz);a.stuck=moved<st*0.25?a.stuck+dt:0;
  if(a.stuck>0.9)arrive(a);}
 else arrive(a);}
function arrive(a){a.target=null;a.f.userData.mode='stand';const cb=a.cb;a.cb=null;if(a===player)moveMarker.material.opacity=0;cb&&cb();}

function npcThink(a,dt,t){
 a.wait-=dt;

 if(a.target||a.wait>0)return;
 if(a.idleFace!=null){a.f.rotation.y+=angDiff(a.f.rotation.y,a.idleFace)*Math.min(1,dt*3);}
 let wp;do{wp=pick(WAYPTS);}while(Math.hypot(wp[0]-a.f.position.x,wp[1]-a.f.position.z)<1.5);
 a.idleFace=null;
 walkAgent(a,wp[0],wp[1],()=>{a.wait=rnd(3,8);if(wp[2]){a.idleFace=Math.PI;a.f.rotation.y=a.f.rotation.y;}
  if(Math.random()<0.45)setTimeout(()=>say(a.f,Math.random()<0.4?pick(NPC_LINES[timeKey]):pick(NPC_LINES.any),3),400);});
}

/* ---------------- 파티클 ---------------- */
function spawn(e,pos,n,o={}){
 for(let i=0;i<n;i++){const isGlow=typeof e==='number';
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:isGlow?glowTex:emojiTex(e),color:isGlow?e:0xffffff,transparent:true,depthWrite:false,blending:isGlow?THREE.AdditiveBlending:THREE.NormalBlending}));
  const s=(o.size||0.3)*rnd(0.7,1.2);sp.scale.set(s,s,1);sp.position.copy(pos).add(new THREE.Vector3(rnd(-1,1)*(o.jit||0.15),rnd(0,1)*(o.jit||0.15),rnd(-1,1)*(o.jit||0.15)));
  sp.renderOrder=15;scene.add(sp);
  particles.push({sp,v:new THREE.Vector3(rnd(-1,1)*(o.spread||0.6),(o.up||1.2)*rnd(0.7,1.3),rnd(-1,1)*(o.spread||0.6)),life:(o.life||1.4)*rnd(0.8,1.2),t:0,g:o.g||0,grow:o.grow||0,s,op:o.op||1});}}
function stepParticles(dt){
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;p.v.y-=p.g*dt;p.sp.position.addScaledVector(p.v,dt);
  const k=p.t/p.life;p.sp.material.opacity=p.op*(k<0.15?k/0.15:1-(k-0.15)/0.85);const sc=p.s*(1+p.grow*k);p.sp.scale.set(sc,sc,1);
  if(p.t>=p.life){scene.remove(p.sp);p.sp.material.dispose();particles.splice(i,1);}}}

/* ---------------- 오디오 (전부 코드로 합성 · 저작권 없음) ---------------- */
const AU={ctx:null,master:null,mus:null,on:true};
function audioStart(){
 if(AU.ctx){AU.ctx.resume&&AU.ctx.resume();return;}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 const ctx=new C();AU.ctx=ctx;
 const master=ctx.createGain();master.gain.value=0;master.gain.setTargetAtTime(0.85,ctx.currentTime,1.2);master.connect(ctx.destination);AU.master=master;
 // 파도
 const len=ctx.sampleRate*8,buf=ctx.createBuffer(2,len,ctx.sampleRate);
 for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let l=0;for(let i=0;i<len;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.2;}
  const F=4000;for(let i=0;i<F;i++){const g=i/F;d[i]*=g;d[len-1-i]*=g;}}
 const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
 const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;
 const wg=ctx.createGain();wg.gain.value=0.34;
 const lfo=ctx.createOscillator();lfo.frequency.value=0.085;const lg=ctx.createGain();lg.gain.value=0.22;lfo.connect(lg);lg.connect(wg.gain);
 const lg2=ctx.createGain();lg2.gain.value=320;lfo.connect(lg2);lg2.connect(lp.frequency);
 src.connect(lp);lp.connect(wg);wg.connect(master);src.start();lfo.start();
 // 음악 버스 + 딜레이
 const mus=ctx.createGain();mus.gain.value=0.2;AU.mus=mus;
 const tone=ctx.createBiquadFilter();tone.type='lowpass';tone.frequency.value=2600;mus.connect(tone);tone.connect(master);
 const dl=ctx.createDelay();dl.delayTime.value=0.62;const fb=ctx.createGain();fb.gain.value=0.33;const dg=ctx.createGain();dg.gain.value=0.35;
 tone.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(dg);dg.connect(master);
 // 루프 스케줄러 (로파이 · 72BPM)
 const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59,62]],PENTA=[72,74,76,79,81,84,86];
 const mf=n=>440*Math.pow(2,(n-69)/12);const SP=60/72/2;let next=ctx.currentTime+0.4,step=0;
 const note=(f,t,dur,type,vol,att)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(mus);o.start(t);o.stop(t+dur+0.05);};
 const tick=()=>{if(!AU.ctx)return;while(next<ctx.currentTime+0.35){const s=step%32,bar=Math.floor(step/8)%4;
  if(s%8===0){CH[bar].forEach(n=>{note(mf(n),next,SP*8.6,'sine',0.05,0.5);note(mf(n)*1.003,next,SP*8.6,'triangle',0.018,0.6);});note(mf(CH[bar][0]-12),next,SP*6,'sine',0.11,0.04);}
  if(s%8===4)note(mf(CH[bar][0]-12+7),next,SP*3,'sine',0.06,0.04);
  if(Math.random()<(s%2?0.18:0.34)){const n=pick(PENTA);note(mf(n),next,1.1,'triangle',0.05,0.008);note(mf(n)*2,next,0.5,'sine',0.012,0.005);}
  next+=SP;step++;}};
 AU.timer=setInterval(tick,90);
 document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;document.hidden?AU.ctx.suspend():AU.ctx.resume();});
}
function sfx(kind){const ctx=AU.ctx;if(!ctx||!AU.on)return;const t=ctx.currentTime;
 const tone=(f,d,type,v,delay=0)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t+delay);g.gain.linearRampToValueAtTime(v,t+delay+0.01);g.gain.exponentialRampToValueAtTime(0.0008,t+delay+d);o.connect(g);g.connect(AU.master);o.start(t+delay);o.stop(t+delay+d+0.05);return o;};
 if(kind==='pop'){const o=tone(520,0.18,'sine',0.25);o.frequency.exponentialRampToValueAtTime(1100,t+0.12);}
 if(kind==='chime'){[1047,1319,1568,2093].forEach((f,i)=>tone(f,1.6,'sine',0.12,i*0.09));}
 if(kind==='happy'){[784,988,1175].forEach((f,i)=>tone(f,0.3,'triangle',0.12,i*0.07));}
 if(kind==='cry'){const o=tone(440,0.8,'sine',0.12);o.frequency.exponentialRampToValueAtTime(260,t+0.75);}
 if(kind==='snap'){const b=ctx.createBuffer(1,ctx.sampleRate*0.12,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=0.35;s.buffer=b;s.connect(g);g.connect(AU.master);s.start();}
 if(kind==='step'){tone(300,0.08,'sine',0.05);}}
function setMute(on){AU.on=on;document.getElementById('snd').textContent=on?'🔊':'🔇';if(AU.master)AU.master.gain.setTargetAtTime(on?0.85:0,AU.ctx.currentTime,0.15);}
function duck(on){if(AU.mus)AU.mus.gain.setTargetAtTime(on?0.04:0.2,AU.ctx.currentTime,0.4);}

/* ---------------- 입력 ---------------- */
function onDown(e){dragging=true;dragMoved=false;lastX=downX=e.clientX;lastY=downY=e.clientY;downT=performance.now();}
function onMove(e){if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;
 if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>7){dragMoved=true;camGoal=null;}
 if(dragMoved){camAngle-=dx*0.006;camTilt=clamp(camTilt-dy*0.004,0.12,1.2);}
 lastX=e.clientX;lastY=e.clientY;}
function onUp(e){if(!dragging)return;dragging=false;if(!dragMoved&&performance.now()-downT<400&&entered)handleClick(e);}
function handleClick(e){
 pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);
 const hit=raycaster.intersectObjects(clickables,false);
 const fh=raycaster.intersectObjects(floorHits,false);
 if(hit.length&&(!fh.length||hit[0].distance<fh[0].distance+0.6)){const a=hit[0].object.userData.act;
  if(a.type==='seer')return goSeer(a.seer);if(a.type==='bar')return goBar();if(a.type==='counter')return goOrder();}
 if(fh.length){const p=fh[0].point;goto(clamp(p.x,-6.5,6.5),clamp(p.z,-4.3,3.65));return;}
 const oh=raycaster.intersectObjects(outsideHits,false);
 if(oh.length){toast('🌊 바다는 창가석에서 제일 예뻐요');goBar();}
}

 const s=c.width/420;x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=8*s;x.fillStyle='rgba(255,255,255,.95)';x.textAlign='right';

 const br=mesh(new THREE.SphereGeometry(0.09,10,8),M(0xe0ac5e,0.85),-0.09,0.05,0,tr);br.scale.set(1.4,0.6,1);br.castShadow=false;
 pe.tray=tr;scene.add(f);pe.full=f;}
function disposeObj(o){scene.remove(o);o.traverse(m=>{if(m.isMesh||m.isSprite){if(m.geometry&&m.geometry!==liteGeo.b&&m.geometry!==liteGeo.h&&m.geometry!==liteGeo.hr)m.geometry.dispose();
 if(m.material&&!Object.values(liteMat).includes(m.material)){if(m.material.map&&m.material.map!==glowTex)m.material.map.dispose();m.material.dispose();}}});}
function removePeer(id){const pe=NET.peers.get(id);if(!pe)return;if(pe.full)disposeObj(pe.full);scene.remove(pe.lite);NET.peers.delete(id);setOnline();}
function updateLOD(){
 const arr=[...NET.peers.values()];const cp=camera.position;
 arr.forEach(pe=>pe.dd=pe.pos.distanceToSquared(cp));arr.sort((a,b)=>a.dd-b.dd);
 arr.forEach((pe,i)=>{const near=i<FULL_MAX;
  if(near&&!pe.full)makePeerFull(pe);
  if(pe.full)pe.full.visible=near;pe.lite.visible=!near;
  if(!near&&pe.full&&i>FULL_MAX+15){disposeObj(pe.full);pe.full=null;}});
}
function peerFulls(){const r=[];NET.peers.forEach(pe=>{if(pe.full&&pe.full.visible)r.push({f:pe.full});});return r;}
function onNet(buf){
 if(!buf||buf.length>400)return;let o;try{o=JSON.parse(buf.toString());}catch(e){return;}
 if(!o||typeof o.i!=='string'||o.i.length>16||o.i===NET.id)return;
 if(o.t==='bye'){removePeer(o.i);return;}
 let pe=NET.peers.get(o.i);
 if(o.t==='s'){
  if(!pe){if(NET.peers.size>=150)return;pe=addPeer(o);pe.pos.set(clamp(+o.x||0,-8,8),0,clamp(+o.z||0,-8,8));}
  pe.seen=performance.now();pe.tx=clamp(+o.x||0,-8,8);pe.tz=clamp(+o.z||0,-8,8);pe.ty=clamp(+o.y||0,0,1);pe.tr=+o.r||0;pe.m=o.m|0;pe.h=!!o.h;
  const nm=cleanName(o.n);const col=OUTFITS.includes(o.c)?o.c:pe.c;
  if(nm!==pe.n||col!==pe.c){pe.n=nm;pe.c=col;if(pe.full){disposeObj(pe.full);pe.full=null;}scene.remove(pe.lite);pe.lite=liteFigure(col);NET.lod=0;}
 }else if(o.t==='e'&&pe){pe.seen=performance.now();
  if(o.k==='say'){const ph=PHRASES[o.v|0];if(ph&&pe.full&&pe.full.visible)say(pe.full,ph,3);}
  else if(o.k==='happy'||o.k==='cry'){pe.react=o.k;pe.reactT=0;
   if(pe.full&&pe.full.visible)say(pe.full,o.k==='happy'?'😆':'😭',1.5);}}
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
(async function(){
 const cdns=["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js","https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"];
 if(window.LOCAL_THREE)cdns.unshift(window.LOCAL_THREE);
 let ok=false;for(const u of cdns){try{await loadScript(u);if(window.THREE){ok=true;break;}}catch(e){}}
 const boot=document.getElementById('boot');
 if(!ok){boot.innerHTML='<h1>🔮 양자팔자 사주카페</h1><p>3D 엔진 로딩 실패 — 새로고침하거나 크롬에서 열어주세요</p>';return;}
 try{await Promise.race([document.fonts?document.fonts.load('40px "Jua"'):0,new Promise(r=>setTimeout(r,1500))]);}catch(e){}
 try{init();}catch(err){console.error(err);boot.innerHTML='<h1>⚠️ 오류</h1><p style="max-width:80%;text-align:center;line-height:1.5">'+(err&&err.message||err)+'</p>';return;}
 setTimeout(()=>{boot.style.opacity=0;setTimeout(()=>boot.remove(),600);},400);
})();
</script>
